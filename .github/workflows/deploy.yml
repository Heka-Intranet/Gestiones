name: Desplegar Solo HTML a GAS por API

on:
  push:
    branches:
      - main  # Si tu rama se llama 'master', cambia 'main' por 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código de GitHub
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 3. Instalar Clasp (API de Google)
      run: npm install -g @google/clasp

    - name: 4. Inyectar llaves de autenticación de Google Cloud
      run: |
        echo '${{ secrets.DECLASPRC_JSON }}' > ~/.clasprc.json

    - name: 5. Descargar el código actual de GAS para no borrar nada
      run: |
        clasp pull

    - name: 6. Empujar código actualizado respetando el backend
      run: |
        clasp push --force
